<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>키틴자추천템 · 여행 꿀템 링크</title>
<meta name="description" content="여행 갈 때 필요한 꿀템만 — 영상 속 번호별 최저가 링크">
<style>
:root{--bg:#F2F6F4;--card:#fff;--ink:#16211E;--muted:#6C7A76;--faint:#9AA6A2;--hair:#E6ECE9;
--ac:#F06292;--ac-d:#C2185B;--ac-soft:#FDE7F0;--warm:#FF7A54;--gold:#E7AE33;
--shadow:0 2px 8px rgba(16,40,34,.05),0 16px 34px -22px rgba(16,40,34,.30)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;line-height:1.5;overflow-x:hidden}
.wrap{max-width:480px;margin:0 auto;padding:0 15px 46px;overflow-x:clip}
.top{position:relative;padding:32px 6px 14px;text-align:center}
.top::before{content:"";position:absolute;inset:-46px -46px auto;height:220px;background:radial-gradient(120% 82% at 50% 0%,var(--ac-soft),transparent 68%);z-index:0}
.avatar{position:relative;z-index:1;width:84px;height:84px;border-radius:50%;margin:0 auto 13px;background:linear-gradient(150deg,var(--ac),#F385AA);display:flex;align-items:center;justify-content:center;box-shadow:0 9px 22px -8px rgba(240,98,146,.62);border:3px solid #fff}
.avatar svg{width:42px;height:42px;color:#fff}
.name{position:relative;z-index:1;font-size:22px;font-weight:800;letter-spacing:-.03em}
.handle{position:relative;z-index:1;font-size:13px;color:var(--ac-d);font-weight:700;margin-top:2px}
.bio{position:relative;z-index:1;font-size:13.5px;color:var(--muted);margin-top:11px;line-height:1.55}
.social{position:relative;z-index:1;display:flex;justify-content:center;gap:8px;margin-top:15px}
.social a{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink);background:#fff;border:1px solid var(--hair);border-radius:999px;padding:8px 15px;box-shadow:var(--shadow);text-decoration:none}
.social a svg{width:15px;height:15px}
.searchwrap{position:sticky;top:0;z-index:20;padding:9px 0 11px;margin-top:6px;background:linear-gradient(var(--bg) 72%,transparent)}
.search{position:relative}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--faint)}
.search input{width:100%;height:46px;border:1px solid var(--hair);background:#fff;border-radius:14px;padding:0 16px 0 42px;font-size:15px;font-family:inherit;color:var(--ink);box-shadow:var(--shadow);outline:none}
.search input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
.search input::placeholder{color:var(--faint)}
.noresult{display:none;text-align:center;color:var(--muted);font-size:14px;padding:34px 0}
.vsec{margin-top:22px}
.vhead{margin:0 3px 11px}
.vtitle{font-size:15px;font-weight:800;line-height:1.35;letter-spacing:-.02em}
.vsub{font-size:12px;color:var(--faint);margin-top:3px;font-weight:600}
.watch{display:inline-block;margin-top:9px;font-size:11.5px;font-weight:800;color:var(--ac-d);background:var(--ac-soft);border-radius:999px;padding:5px 12px;text-decoration:none}
.cards{display:flex;flex-direction:column;gap:10px}
.card{position:relative;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--hair);border-radius:17px;padding:10px 12px 10px 10px;box-shadow:var(--shadow);text-decoration:none;color:inherit;transition:transform .12s ease}
.card:active{transform:scale(.985)}
.no{position:absolute;top:-7px;left:-6px;min-width:26px;height:24px;padding:0 6px;border-radius:12px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(16,40,34,.32);z-index:2}
.thumb{width:66px;height:66px;flex:none;border-radius:12px;overflow:hidden;background:#EEF3F1;border:1px solid var(--hair)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pinfo{flex:1;min-width:0}
.pname{font-size:14px;font-weight:800;line-height:1.32;letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ptag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--ac-d);background:var(--ac-soft);border-radius:6px;padding:2px 7px;margin-top:5px}
.pmeta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.price{font-size:15.5px;font-weight:800;color:var(--ink)}
.orders{font-size:11px;font-weight:700;color:var(--warm)}
.buy{display:inline-flex;align-items:center;gap:3px;margin-top:8px;font-size:12px;font-weight:800;color:#fff;background:var(--ac);border-radius:9px;padding:6px 12px;box-shadow:0 4px 10px -4px rgba(240,98,146,.6)}
.buy svg{margin-top:1px}
.foot{margin-top:28px;text-align:center;font-size:11px;color:var(--faint);line-height:1.65}
.foot b{color:var(--muted)}
</style></head>
<body><div class="wrap">
<header class="top">
  <div class="avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 0-16 0"/><path d="M2 12h20"/><path d="M12 4a15 15 0 0 1 0 16 15 15 0 0 1 0-16"/></svg></div>
  <div class="name">키틴자추천템</div>
  <div class="handle">@kitty_find</div>
  <div class="bio">헬로키티·산리오 덕후가 고른 진짜 예쁜 굿즈만.<br>영상 속 번호를 눌러 최저가로 확인하세요.</div>
  <div class="social"><a href="https://youtube.com/@kitty_find" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 12s0-3.2-.4-4.7a3 3 0 0 0-2.1-2.1C18.9 4.7 12 4.7 12 4.7s-6.9 0-8.5.5A3 3 0 0 0 1.4 7.3C1 8.8 1 12 1 12s0 3.2.4 4.7a3 3 0 0 0 2.1 2.1c1.6.5 8.5.5 8.5.5s6.9 0 8.5-.5a3 3 0 0 0 2.1-2.1C23 15.2 23 12 23 12zM9.8 15.3V8.7l5.7 3.3z"/></svg>유튜브 채널</a></div>
</header>
<div class="searchwrap"><div class="search">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
  <input id="q" type="search" inputmode="search" placeholder="번호·상품명 검색 (예: 우산, 17, 드라이어)" autocomplete="off">
</div></div>
<div id="list">

</div>
<div class="noresult" id="nore">검색 결과가 없어요. 다른 번호나 이름으로 찾아보세요.</div>
<div class="foot"><b>여행템발굴단</b> · 영상 속 상품을 최저가로 연결해 드려요<br>
본 링크에는 알리익스프레스 어필리에이트 링크가 포함되며, 구매 시 일정액의 수수료를 받을 수 있어요.<br>가격·재고는 시점에 따라 달라질 수 있어요.</div>
</div>
<script>
var q=document.getElementById('q'),secs=document.querySelectorAll('.vsec'),nore=document.getElementById('nore');
q.addEventListener('input',function(){
  var v=q.value.trim().toLowerCase(),any=false;
  secs.forEach(function(sec){
    var vis=0;
    sec.querySelectorAll('.card').forEach(function(c){
      var m=!v||c.getAttribute('data-s').indexOf(v)>-1;
      c.style.display=m?'':'none'; if(m)vis++;
    });
    sec.style.display=vis?'':'none'; if(vis)any=true;
  });
  nore.style.display=any?'none':'block';
});
</script>
</body></html>
